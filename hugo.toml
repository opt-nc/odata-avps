baseURL = 'https://opt-nc.github.io/odata-avps/'
locale = 'fr-fr'
defaultContentLanguage = 'fr'

# Fuseau du site : les dates du front-matter sans heure ni décalage (« date: 2026-09-10 »)
# étaient interprétées en UTC. Le pipeline, lui, les calcule en heure de Nouméa (UTC+11) :
# le billet du jour tombait donc onze heures dans le futur et Hugo refusait de le générer.
# Constaté le 10/09/2026 — le mot de la DRH publié à 9h42 restait invisible.
timeZone = 'Pacific/Noumea'
title = "Emploi OPT-NC"
theme = 'hugo-theme-relearn'

[params]
  # Options du thème Relearn
  themeVariant = [ "opt-light", "opt-dark" ]
  landingPageName = "<i class='fa-fw fas fa-home'></i> Bienvenue"
  collapsibleMenu = true
  disableShortcutsTitle = true
  author = "OPT-NC"
  images = ["/assets/logo-opt.png"]

[params.topbar]
    sidebar = "show"

# Vidéos YouTube : mode confidentialité renforcée (youtube-nocookie.com).
# Le site n'a pas de bandeau de consentement ; sans ce réglage, une simple visite
# de la page déposerait des cookies de suivi YouTube, avant même que le visiteur
# ne lance la lecture.
[privacy]
  [privacy.youtube]
    privacyEnhanced = true

[[menu.shortcuts]]
name = "<i class='fas fa-fw fa-info-circle'></i> À propos"
pageRef = "/a-propos"
weight = 10

[[menu.shortcuts]]
name = "<i class='fas fa-fw fa-chart-line'></i> Statistiques"
pageRef = "/stats"
weight = 20

[[menu.shortcuts]]
name = "<i class='fas fa-fw fa-code'></i> Développeurs"
pageRef = "/developpeurs"
weight = 30

[outputFormats.jobs_sitemap]
  mediaType = "application/xml"
  baseName = "jobs-sitemap"
  isHTML = false

[outputFormats.flux_ats]
  mediaType = "application/xml"
  baseName = "flux_ats"
  isHTML = false

[outputFormats.sitemap-index]
  mediaType = "application/xml"
  baseName = "sitemap-index"
  isHTML = false

[outputs]
  home = ['html', 'rss', 'print','markdown','jobs_sitemap','flux_ats','sitemap-index']
  page = ['html', 'print','markdown']
  section = ['html', 'rss', 'print','markdown']

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true # ✅ Autorise le HTML brut (comme ton footer <center>) dans le Markdown


[params.social]
  facebook  = "https://www.facebook.com/OPT.NC"
  twitter   = "https://twitter.com/opt_nc"
  instagram = "https://www.instagram.com/opt_nc/"
  youtube   = "https://www.youtube.com/user/optnc"
  linkedin  = "https://www.linkedin.com/company/opt-new-caledonia"
  tiktok    = "https://www.tiktok.com/discover/team-opt-nc"

[module]
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "data"
    target = "data"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "i18n"
    target = "i18n"
  [[module.mounts]]
    source = "archetypes"
    target = "archetypes"