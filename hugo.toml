baseURL = 'https://opt-nc.github.io/odata-avps/'
locale = 'fr-fr'
defaultContentLanguage = 'fr'
title = "Emploi OPT-NC"
theme = 'hugo-theme-relearn'

[params]
  # Options du thème Relearn
  themeVariant = [ "opt-light", "opt-dark" ]
  landingPageName = "<i class='fa-fw fas fa-home'></i> Bienvenue"
  collapsibleMenu = true
  disableShortcutsTitle = true
  author = "OPT-NC"
  images = ["/assets/logo-opt.png"]

[params.topbar]
    sidebar = "show"

# Moteur de recherche : Orama plutôt que Lunr (défaut du thème).
# Ce qu'on gagne : la tolérance aux fautes de frappe, précieuse sur un corpus
# plein de termes longs (« télécommunications », « concepteur-développeur »).
# Ce qu'on paie : +22 Ko gzippés (24 contre 2 pour Lunr).
# Ce qui ne change PAS : l'index searchindex.fr.js, 57 Ko gzippés, généré par le
# thème indépendamment du moteur — c'est lui le vrai poids, et il grossira avec
# les archives. Le réduire passerait par les options search.index du thème, pas
# par le choix de l'adaptateur.
[params.search]
  [params.search.adapter]
    identifier = "orama"

[[menu.shortcuts]]
name = "<i class='fas fa-fw fa-info-circle'></i> À propos"
pageRef = "/a-propos"
weight = 10

[[menu.shortcuts]]
name = "<i class='fas fa-fw fa-chart-line'></i> Statistiques"
pageRef = "/stats"
weight = 20

[outputFormats.jobs_sitemap]
  mediaType = "application/xml"
  baseName = "jobs-sitemap"
  isHTML = false

[outputFormats.flux_ats]
  mediaType = "application/xml"
  baseName = "flux_ats"
  isHTML = false

[outputFormats.sitemap-index]
  mediaType = "application/xml"
  baseName = "sitemap-index"
  isHTML = false

[outputs]
  home = ['html', 'rss', 'print','markdown','jobs_sitemap','flux_ats','sitemap-index']
  page = ['html', 'print','markdown']
  section = ['html', 'rss', 'print','markdown']

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true # ✅ Autorise le HTML brut (comme ton footer <center>) dans le Markdown


[params.social]
  facebook  = "https://www.facebook.com/OPT.NC"
  twitter   = "https://twitter.com/opt_nc"
  instagram = "https://www.instagram.com/opt_nc/"
  youtube   = "https://www.youtube.com/user/optnc"
  linkedin  = "https://www.linkedin.com/company/opt-new-caledonia"
  tiktok    = "https://www.tiktok.com/discover/team-opt-nc"

[module]
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "data"
    target = "data"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "i18n"
    target = "i18n"
  [[module.mounts]]
    source = "archetypes"
    target = "archetypes"